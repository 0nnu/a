<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق التلقائي</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #fff;
        }

        .container {
            text-align: center;
            background: #fff;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
        }

        .container h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .container p {
            font-size: 1rem;
            margin-bottom: 20px;
            color: #666;
        }

        .loading {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 20px;
        }

        .spinner {
            margin: 0 auto 15px auto;
            border: 5px solid rgba(0, 0, 0, 0.1);
            border-left-color: #4facfe;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>الرجاء الانتظار...</h1>
        <p>نحن نتحقق من أنك لست روبوتًا</p>
        <div class="spinner"></div>
        <p class="loading">جارٍ التحقق من هويتك...</p>
        <!-- Cloudflare Turnstile CAPTCHA -->
        <div class="cf-turnstile" 
             data-sitekey="0x4AAAAAAA5Sfsj-pcRmgmyy" 
             data-callback="onSuccess" 
             data-error-callback="onError" 
             style="display: none;"></div>
    </div>

    <script>
        async function verifyCaptcha(token) {
            const SECRET_KEY = "0x4AAAAAAA5Sflli2oJSULbsVppVEPK-gsk";
            const response = await fetch("https://challenges.cloudflare.com/turnstile/v0/siteverify", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `secret=${SECRET_KEY}&response=${token}`
            });

            const result = await response.json();
            return result.success;
        }

        function onSuccess(token) {
            // تحقق من التوكن مباشرة من Cloudflare
            verifyCaptcha(token)
                .then(success => {
                    if (success) {
                        // انقل المستخدم إلى الصفحة التالية
                        window.location.href = "/index";
                    } else {
                        alert("فشل التحقق! الرجاء المحاولة مرة أخرى.");
                    }
                })
                .catch(error => {
                    console.error("خطأ أثناء التحقق:", error);
                    alert("حدث خطأ! الرجاء المحاولة لاحقًا.");
                });
        }

        function onError() {
            alert("تعذر إكمال التحقق. الرجاء المحاولة لاحقًا.");
        }

        // تفعيل التحقق تلقائيًا عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('.cf-turnstile').style.display = 'block';
        });
    </script>
</body>
</html>
